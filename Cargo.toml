[package]
name = "minimax-quota-tray"
version = "0.2.0"
edition = "2021"
description = "GNOME tray indicator for MiniMax quota — Rust port of the gjs original"
license = "MIT"

[dependencies]
# StatusNotifierItem over the session D-Bus — pure Rust via zbus.
# Works on GNOME (with AppIndicator extension), KDE, XFCE, etc. No more
# GTK / libappindicator dependency.
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Native SVG → ARGB pixel buffer, sent via StatusNotifierItem IconPixmap.
# Minimal features: no text, no system fonts, no embedded raster images
# (we only render simple geometric SVGs).
resvg = { version = "0.48", default-features = false }
usvg = { version = "0.48", default-features = false }

# Async / HTTP / JSON
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "blocking"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
# StreamExt::next() for consuming zbus::proxy::SignalStream (the
# Stream trait isn't in scope by default; futures-util provides it).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keyring — Secret Service (freedesktop, not GNOME-specific).
secret-service = { version = "3", features = ["rt-tokio-crypto-rust"] }

anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
approx = "0.5"
serde_json = "1"

[profile.release]
opt-level = "z"     # minimize binary size
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-debug]
inherits = "release"
strip = false       # keep symbols so we can read stack traces
