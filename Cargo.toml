[package]
name = "llm-quota-tray"
version = "0.4.0"
edition = "2021"
rust-version = "1.75"  # MSRV: edition 2021 baseline + async-trait / zbus 5 / tokio 1 requirements
description = "Provider-agnostic tray indicator for LLM API quota — supports any quota API via a config-only port"
license = "MIT"
# Canonical repo. Used by crates.io / docs.rs for the "Repository" link
# and by `cargo install` output. Keep in sync with the `git remote`.
repository = "https://github.com/dtg01100/minimax-quota-tray"
# Rendered README on crates.io (the same file shipped at the repo root).
readme = "README.md"
# Project homepage (distinct from `repository` — points at the
# repo's GitHub project page, not the git endpoint).
homepage = "https://github.com/dtg01100/minimax-quota-tray"
# Hosted API docs (currently docs.rs, which builds from the crates.io
# tarball). Switch to a GH-Pages URL if we ever self-host.
documentation = "https://docs.rs/llm-quota-tray"
# Keywords are case-insensitive, max 5, comma-separated, lowercase.
# crates.io uses these for the search index; pick terms users would
# actually search for.
keywords = ["tray", "system-tray", "status-notifier-item", "quota", "llm"]
# crates.io categories: each crate goes in exactly one. `gui` is the
# closest fit (system tray is GUI-adjacent); the alternative
# `api-bindings` was considered and rejected because the project
# *renders* a UI even though it consumes HTTP APIs.
categories = ["gui"]
# Excluded packages from the published tarball — purely build-time
# docs/workflow files that don't belong in `~/.cargo/registry/`.
exclude = [
    ".github/*",
    "docs/*",
    "examples/*",
    ".gitignore",
]
# Authors and description shown on the crates.io page header.
authors = ["David Lafreniere <dlafreniere@example.com>"]

[dependencies]
# StatusNotifierItem over the session D-Bus — pure Rust via zbus.
# Works on GNOME (with AppIndicator extension), KDE, XFCE, etc. No more
# GTK / libappindicator dependency.
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Native 2D rasterizer for the tray icon. We render three circles (track,
# progress arc, center dot) directly with tiny-skia's path API — no SVG
# parser, no usvg, no resvg's CLI-arg parser (pico-args). The png-format
# feature is disabled: we emit raw ARGB32 bytes to SNI's IconPixmap, never
# PNG, so dropping the feature removes `png`, `flate2`, `miniz_oxide`,
# `fdeflate`, `crc32fast`, `simd-adler32`, `adler2` from the build.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

# Async / HTTP / JSON
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json", "blocking"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
# StreamExt::next() for consuming zbus::proxy::SignalStream (the
# Stream trait isn't in scope by default; futures-util provides it).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keyring — GNOME Keyring / KWallet via the `secret-tool(1)` CLI
# (libsecret-tools). We shell out to `secret-tool store` /
# `secret-tool lookup` instead of linking the `secret-service` Rust
# crate, which panics on tokio-runtime-context conflict (see
# src/keyring.rs for the rationale).
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = "z"     # minimize binary size
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-debug]
inherits = "release"
strip = false       # keep symbols so we can read stack traces
