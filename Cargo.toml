[package]
name = "llm-quota-tray"
version = "0.3.0"
edition = "2021"
description = "Provider-agnostic tray indicator for LLM API quota — supports any quota API via a config-only port"
license = "MIT"

[dependencies]
# StatusNotifierItem over the session D-Bus — pure Rust via zbus.
# Works on GNOME (with AppIndicator extension), KDE, XFCE, etc. No more
# GTK / libappindicator dependency.
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Native 2D rasterizer for the tray icon. We render three circles (track,
# progress arc, center dot) directly with tiny-skia's path API — no SVG
# parser, no usvg, no resvg's CLI-arg parser (pico-args). The png-format
# feature is disabled: we emit raw ARGB32 bytes to SNI's IconPixmap, never
# PNG, so dropping the feature removes `png`, `flate2`, `miniz_oxide`,
# `fdeflate`, `crc32fast`, `simd-adler32`, `adler2` from the build.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

# Async / HTTP / JSON
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
# StreamExt::next() for consuming zbus::proxy::SignalStream (the
# Stream trait isn't in scope by default; futures-util provides it).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keyring — GNOME Keyring / KWallet via the `secret-tool(1)` CLI
# (libsecret-tools). We shell out to `secret-tool store` /
# `secret-tool lookup` instead of linking the `secret-service` Rust
# crate, which panics on tokio-runtime-context conflict (see
# src/keyring.rs for the rationale).
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = "z"     # minimize binary size
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-debug]
inherits = "release"
strip = false       # keep symbols so we can read stack traces
